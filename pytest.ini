[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

addopts = 
    -v 
    -s 
    --tb=short
    --html=reports/test_report.html 
    --self-contained-html
markers =
    api: Các test case kiểm thử REST API
    ui: Các test case kiểm thử giao diện (Playwright)
    smoke: Bộ test nhanh kiểm tra các tính năng cốt lõi
    regression: Bộ test hồi quy toàn diện
